name: CI

on:
  push:
    branches: ["**"]
    # Version tags build the executable and the installer and attach them to
    # a GitHub release; without this line the release job could never run.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check app tests main.py
      # Advisory only: the source is hand-formatted and deliberately disagrees
      # with ruff format in places. Printing the diff is useful; failing the step
      # every single run is not — an annotation that is always red teaches people
      # to stop reading annotations.
      - name: Show where ruff format would disagree
        run: ruff format --diff app tests main.py || true

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The service layer needs no Tk, but importing app.ui does. Installing it
      # keeps the UI smoke tests from being skipped on Linux.
      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The UI smoke tests skip themselves when there is no display; xvfb gives
      # them one so they actually run.
      - name: Run tests (Linux, with a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -t . --verbose

      - name: Run tests
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -t . --verbose

  build:
    name: Windows executable
    runs-on: windows-latest
    needs: [lint, test]
    if: >-
      github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - run: pyinstaller RE4.spec --noconfirm
      # The installer is what a shop actually installs; the bare exe is the
      # artifact for people who know what a folder is.
      - name: Build the Windows installer
        run: choco install innosetup -y --no-progress; iscc installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: RE4-windows
          path: dist/RE4.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: RE4-windows-installer
          path: dist/installer/*.exe
          if-no-files-found: ignore

  release:
    name: Attach the build to a GitHub release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      # gh talks to the repository it is sitting in; without a checkout it
      # has no idea where to publish.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RE4-windows
      - uses: actions/download-artifact@v4
        with:
          name: RE4-windows-installer
      # A re-run after a failed publish finds the old draft in the way: a
      # create for a tag that already has a release refuses.
      - name: Clear any stale draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$GITHUB_REF_NAME" --yes || true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # A draft release never carries a real tag (GitHub calls it
          # untagged-… until it is published), so the steps below must address
          # the draft by the URL create prints, never by tag name — a lookup
          # by tag finds nothing and 404s.
          url=$(gh release create "$GITHUB_REF_NAME" --draft \
            --title "RE4 $GITHUB_REF_NAME" --generate-notes)
          gh release upload "$url" RE4.exe *.exe --clobber
          gh release edit "$url" --draft=false
