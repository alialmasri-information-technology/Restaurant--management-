name: CI

on:
  push:
    branches: ["**"]
    # Version tags build the executable and the installer and attach them to
    # a GitHub release; without this line the release job could never run.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check app tests main.py
      # Advisory only: the source is hand-formatted and deliberately disagrees
      # with ruff format in places. Printing the diff is useful; failing the step
      # every single run is not — an annotation that is always red teaches people
      # to stop reading annotations.
      - name: Show where ruff format would disagree
        run: ruff format --diff app tests main.py || true

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # The service layer needs no Tk, but importing app.ui does. Installing it
      # keeps the UI smoke tests from being skipped on Linux.
      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # xvfb is installed above precisely so the screen tests run here. They
      # skip themselves when Tk cannot open a window, so a broken xvfb would
      # take the whole set out of the run without failing it. Promising a
      # display makes that a failure instead of a silence.
      - name: Run tests (Linux, with a virtual display)
        if: runner.os == 'Linux'
        env:
          RE4_REQUIRE_DISPLAY: "1"
        run: xvfb-run -a python -m unittest discover -s tests -t . --verbose

      - name: Run tests
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -t . --verbose

  build:
    name: Windows executable
    runs-on: windows-latest
    needs: [lint, test]
    if: >-
      github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - run: pyinstaller RE4.spec --noconfirm
      # The installer is what a shop actually installs; the bare exe is the
      # artifact for people who know what a folder is.
      # ';' would run iscc even if the install of Inno Setup had failed, and
      # a release that quietly ships without its installer is worse than one
      # that stops. Each command must succeed before the next is attempted.
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build the Windows installer
        run: iscc installer.iss
      - uses: actions/upload-artifact@v6
        with:
          name: RE4-windows
          path: dist/RE4.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: RE4-windows-installer
          path: dist/installer/*.exe
          # 'ignore' let a missing installer sail past the build and surface
          # much later as a confusing download failure in the release job.
          # If the installer is not there, say so here.
          if-no-files-found: error

  release:
    name: Attach the build to a GitHub release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      # gh talks to the repository it is sitting in; without a checkout it
      # has no idea where to publish.
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: RE4-windows
      - uses: actions/download-artifact@v7
        with:
          name: RE4-windows-installer
      # A re-run after a failed publish finds the old draft in the way: a
      # create for a tag that already has a release refuses.
      - name: Clear any stale draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$GITHUB_REF_NAME" --yes || true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Address the draft by its tag, not by the URL `create` prints.
          # A draft's URL reads .../releases/tag/untagged-<hash>, which looks
          # as though the tag were unusable and is why an earlier attempt fed
          # that URL back in. `gh release upload` takes a tag and answers
          # "release not found" for anything else, so it failed every time
          # while the draft sat there half-built. A draft does resolve by tag:
          # `gh release view "$GITHUB_REF_NAME"` finds it.
          #
          # The assets go on while it is still a draft, so the release only
          # becomes visible to anyone once it is complete.
          gh release create "$GITHUB_REF_NAME" --draft \
            --title "RE4 $GITHUB_REF_NAME" --generate-notes
          # Both artifacts land in the working directory, so one glob covers
          # them; naming RE4.exe as well uploaded it twice.
          gh release upload "$GITHUB_REF_NAME" *.exe --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
